mz_api_security.settings:
  type: config_object
  label: "MZ API Security settings"
  mapping:
    allowed_domain:
      type: string
      label: "Allowed domain"
    api_path_prefix:
      type: string
      label: "API path prefix"
    enable_logging:
      type: boolean
      label: "Enable logging"
    allowed_ips:
      type: text
      label: "Allowed IPs"
