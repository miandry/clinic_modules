rag_api.search_patients:
  path: '/api/rag/patients'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\rag_api\Controller\RagController::searchPatients'
    _format: 'json'
  requirements:
    _permission: 'access content'

