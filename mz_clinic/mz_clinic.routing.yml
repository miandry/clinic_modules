# ─── Auth & user management (migrated from mz_crud) ─────────────────────────

mz_clinic.login:
  path: "/api/clinic/crud/login"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ApiController::login'
    _title: "Login user"
  methods: [POST]
  requirements:
    _access: "TRUE"
  options:
    no_cache: TRUE

